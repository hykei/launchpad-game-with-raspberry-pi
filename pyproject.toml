[project]
name = "hykei-games"
version = "0.1.0"
description = "Two-player 8x8 LaunchPad games for hykei-84."
requires-python = ">=3.9"
dependencies = [
  "python-chess>=1.999",
]

[project.optional-dependencies]
hardware = [
  "mido>=1.3",
  "python-rtmidi>=1.5",
  "sense-hat>=2.6",
  "smbus2>=0.4",
  "RPLCD>=1.3",
]

[project.scripts]
hykei-games = "hykei_games.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
